# Switchboard core services. Bridges live in the generated compose.bridges.yml;
# .env (generated by sb) sets COMPOSE_FILE so plain `docker compose` sees both.
name: switchboard

services:
  tailscale:
    image: tailscale/tailscale:${TAILSCALE_TAG}
    hostname: switchboard
    environment:
      TS_HOSTNAME: switchboard
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "true"
      TS_AUTH_ONCE: "true"
      TS_SERVE_CONFIG: /config/serve.json
    # TS_AUTHKEY, written by `sb tailscale-key`; only needed for the first login.
    env_file:
      - path: ./secrets/tailscale.env
        required: false
    volumes:
      - ts-state:/var/lib/tailscale
      - ./config/tailscale:/config:ro
    restart: unless-stopped

  caddy:
    image: caddy:${CADDY_TAG}
    volumes:
      - ./config/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
    ports:
      - "127.0.0.1:8080:80"
    restart: unless-stopped

  postgres:
    image: postgres:${POSTGRES_TAG}
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/pg_root
    secrets: [pg_root]
    volumes:
      - pg-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  synapse:
    image: matrixdotorg/synapse:${SYNAPSE_TAG}
    # Named volumes start root-owned; Synapse runs as 991.
    entrypoint: ["/bin/sh", "-c", "chown 991:991 /media && exec /start.py"]
    environment:
      SYNAPSE_CONFIG_PATH: /data/config/homeserver.yaml
    volumes:
      - ./config/synapse:/data/config:ro
      - ./appservices:/data/appservices:ro
      - synapse-media:/media
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8008/health"]
      interval: 15s
      timeout: 5s
      start_period: 30s
    restart: unless-stopped

  # iOS push. Only with a paid Apple account: `sb push` turns it on.
  sygnal:
    image: matrixdotorg/sygnal:${SYGNAL_TAG}
    profiles: [ios-push]
    environment:
      SYGNAL_CONF: /config/sygnal.yaml
    volumes:
      - ./config/sygnal:/config:ro
      - ./secrets/apns.p8:/secrets/apns.p8:ro
    healthcheck:
      # The image's own check calls curl, which the image doesn't ship.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health', timeout=4)"]
      interval: 15s
      timeout: 5s
      start_period: 20s
    restart: unless-stopped

  hub:
    build: ../sb
    image: switchboard-hub:dev
    command: ["-config", "/config/hub.yaml"]
    volumes:
      - ./config/hub:/config:ro
    depends_on:
      synapse:
        condition: service_healthy
    restart: unless-stopped

volumes:
  ts-state: {}
  pg-data: {}
  synapse-media: {}

secrets:
  pg_root:
    file: ./secrets/pg_root
